name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      # Reproductibilité (E3-2) : relancer le pipeline doit redonner exactement les fichiers du dépôt
      - run: npm run data:build && git diff --exit-code -- src/data data/publication
      - run: npm test
      - run: npm run build
